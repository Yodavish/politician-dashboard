[project]
name = "politician-dashboard"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.3.4",
    "psycopg-pool>=3.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
