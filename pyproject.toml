[project]
name = "politician-dashboard"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.3.6",
    "psycopg-pool>=3.3.2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.27.0",
    # Used by the tools/ai_review static analyzer (already pulled in
    # transitively by FastAPI; declared directly here for the tool).
    "pydantic>=2.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
