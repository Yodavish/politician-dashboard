name: Deploy to EC2 (SSM Run Command)

# Continuous deployment for the single production EC2 instance. Runs after a
# push/merge to `main` and is not a merge gate: CI and the advisory AI review
# are the only pull-request checks. The job authenticates to AWS through
# GitHub Actions OIDC (short-lived credentials, no long-lived access keys and
# no SSH keys), assumes a dedicated IAM role whose trust policy is restricted
# to this repository's `main` branch, then drives the deployment on the
# instance with AWS Systems Manager Run Command (AWS-RunShellScript), which
# runs the deployment script at /opt/politician-dashboard/deploy.sh.

on:
  push:
    branches: [main]

# id-token: write is required for OIDC, and contents: read is required to
# check out source for the container builds. No other repository permissions
# are granted.
permissions:
  id-token: write
  contents: read

# Only one production deployment at a time; newer pushes queue behind the
# in-flight deployment instead of cancelling it.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Assume AWS CD role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: politician-dashboard-cd
          role-duration-seconds: 1800
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate configuration and assumed identity
        run: |
          set -euo pipefail
          : "${AWS_REGION:?missing secret: AWS_REGION}"
          : "${AWS_ROLE_TO_ASSUME:?missing secret: AWS_ROLE_TO_ASSUME}"
          : "${EC2_INSTANCE_ID:?missing secret: EC2_INSTANCE_ID}"
          aws sts get-caller-identity

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/politician-dashboard-api:${{ github.sha }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/politician-dashboard-web:${{ github.sha }}

      - name: Send deployment command to EC2 via SSM
        id: send-command
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid IMAGE_TAG" >&2
            exit 1
          fi
          parameters=$(jq -cn --arg image_tag "$IMAGE_TAG" \
            '{commands:["IMAGE_TAG=\($image_tag) bash /opt/politician-dashboard/deploy.sh"]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$parameters" \
            --comment "Deploy $IMAGE_TAG to production" \
            --query Command.CommandId --output text)
          echo "Sent SSM command $command_id"
          echo "command-id=$command_id" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment to finish
        id: wait
        env:
          COMMAND_ID: ${{ steps.send-command.outputs.command-id }}
        run: |
          set -euo pipefail
          status="Pending"
          attempt=0
          while [ "$status" = "Pending" ] || [ "$status" = "InProgress" ] || [ "$status" = "Delayed" ]; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 90 ]; then
              echo "Deployment did not finish within ~15 minutes (last status: $status)" >&2
              exit 1
            fi
            sleep 10
            status=""
            for i in 1 2 3 4 5; do
              if status=$(aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query Status --output text 2>/dev/null); then
                break
              fi
              sleep 5
            done
            if [ -z "$status" ]; then
              echo "Could not retrieve invocation for command $COMMAND_ID" >&2
              exit 1
            fi
            echo "status: $status"
          done
          echo "final-status=$status" >> "$GITHUB_OUTPUT"

      - name: Report deployment result
        env:
          COMMAND_ID: ${{ steps.send-command.outputs.command-id }}
          FINAL_STATUS: ${{ steps.wait.outputs.final-status }}
        run: |
          set -euo pipefail
          stdout=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query StandardOutputContent --output text || true)
          stderr=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query StandardErrorContent --output text || true)
          if [ "$FINAL_STATUS" != "Success" ]; then
            echo "Deployment FAILED (status: $FINAL_STATUS)" >&2
            echo "--- standard output ---" >&2
            printf '%s\n' "$stdout" >&2
            echo "--- standard error ---" >&2
            printf '%s\n' "$stderr" >&2
            exit 1
          fi
          echo "Deployment succeeded ($FINAL_STATUS)"
          echo "--- standard output ---"
          printf '%s\n' "$stdout"
