name: politician-dashboard

services:
  db:
    image: postgres:16
    container_name: politician-dashboard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: 110982595164.dkr.ecr.us-east-1.amazonaws.com/politician-dashboard-api:${IMAGE_TAG:?IMAGE_TAG must be set}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-politician-dashboard-api}
      OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE:-politician-dashboard}
      OTEL_DEPLOYMENT_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:-production}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: 110982595164.dkr.ecr.us-east-1.amazonaws.com/politician-dashboard-web:${IMAGE_TAG:?IMAGE_TAG must be set}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
